<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Career Companion</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page" data-page="login">
    <main class="auth-panel">
        <h1>Welcome Back</h1>
        <p>Login to continue your career preparation journey.</p>
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="name@example.com" />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter password" />
        </div>
        <button class="button" onclick="loginUser()">Login</button>
        <p class="auth-note">Don't have an account? <a href="register.html">Register</a></p>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
